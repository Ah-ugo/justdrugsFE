<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Drugs — Banners & Ads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="app-shell"></div>
  <div class="admin-overlay" id="admin-banner-overlay" hidden>
    <div class="admin-modal" style="max-width:720px">
      <div class="admin-modal-header">
        <h2 class="admin-modal-title" id="admin-banner-form-title">Edit Banner</h2>
        <button class="admin-modal-close" id="admin-banner-modal-close">${Icons.close}</button>
      </div>
      <form class="admin-form-panel" id="admin-banner-form" style="border:none;padding:0;margin:0;max-width:none">
        <input type="hidden" id="admin-banner-id">
        <div class="form-row">
          <div class="form-group">
            <label for="admin-banner-name">Banner Name *</label>
            <input type="text" id="admin-banner-name" required placeholder="e.g. Summer Sale Hero">
          </div>
          <div class="form-group">
            <label for="admin-banner-type">Type</label>
            <select id="admin-banner-type"><option value="hero">Hero</option><option value="shop">Shop</option><option value="sidebar">Sidebar</option><option value="popup">Category Popup</option><option value="announcement">Announcement</option></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="admin-banner-start">Start Date</label>
            <input type="date" id="admin-banner-start">
          </div>
          <div class="form-group">
            <label for="admin-banner-end">End Date</label>
            <input type="date" id="admin-banner-end">
          </div>
        </div>
        <div class="form-group">
          <label><input type="checkbox" id="admin-banner-active"> Active</label>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="admin-banner-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Banner</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/admin-shared.js"></script>
  <script src="js/admin-banners.js"></script>
</body>
</html>
