<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Drugs — Admins</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <header class="admin-header">
    <div class="admin-header-title">Just Drugs Admin</div>
    <div style="display:flex;gap:8px;">
      <a class="btn btn-secondary" href="admin-dashboard.html">Back</a>
      <button class="btn btn-secondary" id="admin-logout-btn">Sign Out</button>
    </div>
  </header>
  <main class="admin-main">
    <div class="admin-toolbar">
      <h1 class="admin-page-title">Admins</h1>
      <button class="btn btn-primary" id="admin-create-admin-btn">+ New Admin</button>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="admin-admins-tbody"></tbody>
      </table>
    </div>
  </main>
  <div class="admin-overlay" id="admin-admin-overlay" hidden>
    <form class="admin-form" id="admin-admin-form">
      <h2 id="admin-admin-form-title">Create Admin</h2>
      <input type="hidden" id="admin-admin-id">
      <div class="form-group">
        <label for="admin-admin-full-name">Full Name</label>
        <input type="text" id="admin-admin-full-name" required>
      </div>
      <div class="form-group">
        <label for="admin-admin-email">Email</label>
        <input type="email" id="admin-admin-email" required>
      </div>
      <div class="form-group">
        <label for="admin-admin-role">Role</label>
        <select id="admin-admin-role" required>
          <option value="super_admin">Super Admin</option>
          <option value="admin">Admin</option>
          <option value="pharmacist">Pharmacist</option>
          <option value="inventory_manager">Inventory Manager</option>
          <option value="customer_support">Customer Support</option>
          <option value="delivery_manager">Delivery Manager</option>
        </select>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="admin-admin-is-active" checked> Active</label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="admin-admin-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="admin-admin-form-btn">Save</button>
      </div>
    </form>
  </div>
  <script src="js/admin-shared.js"></script>
  <script src="js/admin-admins.js"></script>
</body>
</html>
