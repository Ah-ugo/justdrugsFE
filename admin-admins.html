<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Drugs — Admins</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="app-shell"></div>
  <div class="admin-overlay" id="admin-admin-overlay" hidden>
    <div class="admin-modal" style="max-width:520px">
      <div class="admin-modal-header">
        <h2 class="admin-modal-title" id="admin-admin-form-title">Create Admin</h2>
        <button class="admin-modal-close" id="admin-admin-modal-close">${Icons.close}</button>
      </div>
      <form class="admin-form-panel" id="admin-admin-form" style="border:none;padding:0;margin:0;max-width:none">
        <input type="hidden" id="admin-admin-id">
        <div class="form-group">
          <label for="admin-admin-full-name">Full Name *</label>
          <input type="text" id="admin-admin-full-name" required>
        </div>
        <div class="form-group">
          <label for="admin-admin-email">Email *</label>
          <input type="email" id="admin-admin-email" required>
        </div>
        <div class="form-group">
          <label for="admin-admin-role">Role *</label>
          <select id="admin-admin-role" required>
            <option value="super_admin">Super Admin</option>
            <option value="admin">Admin</option>
            <option value="pharmacist">Pharmacist</option>
            <option value="inventory_manager">Inventory Manager</option>
            <option value="customer_support">Customer Support</option>
            <option value="delivery_manager">Delivery Manager</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="admin-admin-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/admin-shared.js"></script>
  <script src="js/admin-admins.js"></script>
</body>
</html>
