<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers — Just Drugs Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="customers">
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="app-shell"></div>

  <div id="page-content" hidden>
    <div class="page-head">
      <div>
        <h1 class="page-title">Customers</h1>
        <p class="page-subtitle">Manage your customer base, orders and spending.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary" id="cust-export-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg> Export</button>
      </div>
    </div>

    <div class="grid grid-4 mb-24">
      <div class="card summary-card"><div class="summary-card-label">Total Customers</div><div class="summary-card-value">1,284</div><div class="summary-card-foot">↑ 3.1% this month</div></div>
      <div class="card summary-card"><div class="summary-card-label">New This Month</div><div class="summary-card-value">86</div><div class="summary-card-foot">+12% vs last month</div></div>
      <div class="card summary-card"><div class="summary-card-label">Repeat Purchase Rate</div><div class="summary-card-value">42%</div><div class="summary-card-foot">↑ 2.4%</div></div>
      <div class="card summary-card"><div class="summary-card-label">Avg Lifetime Value</div><div class="summary-card-value">₦74,500</div><div class="summary-card-foot">Slightly up</div></div>
    </div>

    <div class="card mb-16">
      <div class="card-body">
        <div class="flex items-center justify-between wrap gap-12">
          <div class="input-wrap">
            <span class="input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
            <input type="text" class="input" id="cust-search" placeholder="Search name, email, phone…" style="width:300px;padding-left:36px;">
          </div>
          <div class="flex items-center gap-8">
            <select class="select" id="cust-status-filter" style="width:150px;">
              <option value="">All statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
              <option value="vip">VIP / Loyal</option>
            </select>
            <select class="select" id="cust-sort" style="width:170px;">
              <option value="spend">Sort: Total spend</option>
              <option value="recent">Sort: Recent</option>
              <option value="orders">Sort: Orders</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th>Customer</th><th>Contact</th><th class="text-right">Orders</th><th class="text-right">Total Spend</th>
              <th>Loyalty</th><th>Status</th><th>Joined</th><th style="width:90px;">Actions</th>
            </tr>
          </thead>
          <tbody id="customers-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="js/admin-shared.js"></script>
  <script src="js/admin-customers.js"></script>
</body>
</html>

</content>
