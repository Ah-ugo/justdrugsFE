<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just Drugs — Admin Login</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div class="admin-login-screen" id="admin-login-screen">
    <div class="admin-login-card">
      <div class="admin-login-title">Just Drugs Admin</div>
      <div class="admin-login-subtitle">Sign in to manage your store</div>
      <form class="admin-login-form" id="admin-login-form">
        <div class="form-group">
          <label for="admin-login-email">Email</label>
          <input type="email" id="admin-login-email" placeholder="admin@justdrugs.com" required>
        </div>
        <div class="form-group">
          <label for="admin-login-password">Password</label>
          <input type="password" id="admin-login-password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary admin-login-btn" id="admin-login-btn">Sign In</button>
      </form>
    </div>
  </div>
  <script src="js/admin-shared.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
