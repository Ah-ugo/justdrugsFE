<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — Just Drugs Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="products">
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="app-shell"></div>

  <div id="page-content" hidden>
    <div class="page-head">
      <div>
        <h1 class="page-title">Products</h1>
        <p class="page-subtitle" id="products-total-line">Manage your pharmaceutical catalogue.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary" id="import-products-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg> Import</button>
        <button class="btn btn-secondary" id="export-products-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg> Export</button>
        <a class="btn btn-primary" href="admin-products.html?new=1" id="add-product-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg> Add Product</a>
      </div>
    </div>

    <div class="card mb-16">
      <div class="card-body">
        <div class="toolbar" style="margin-bottom:0;">
          <div class="toolbar-left">
            <div class="input-wrap">
              <span class="input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
              <input type="text" class="input" id="product-search" placeholder="Search name, SKU, generic name…" style="width:280px;padding-left:36px;">
            </div>
            <select class="select" id="product-category-filter" style="width:170px;"><option value="">All categories</option></select>
            <select class="select" id="product-status-filter" style="width:150px;">
              <option value="">All status</option>
              <option value="IN_STOCK">In stock</option>
              <option value="LOW_STOCK">Low stock</option>
              <option value="OUT_OF_STOCK">Out of stock</option>
            </select>
            <select class="select" id="product-rx-filter" style="width:170px;">
              <option value="">All types</option>
              <option value="rx">Prescription required</option>
              <option value="otc">Over the counter</option>
            </select>
          </div>
          <div class="toolbar-right">
            <div class="segmented" id="product-view-toggle">
              <button class="active" data-view="table"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/></svg></button>
              <button data-view="grid"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></button>
            </div>
          </div>
        </div>
        <div class="mt-16" id="bulk-bar" style="display:none;">
          <div class="alert alert-info" style="align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
            <div><b id="bulk-count">0</b> selected</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-sm btn-secondary" id="bulk-archive-btn">Archive</button>
              <button class="btn btn-sm btn-secondary" id="bulk-duplicate-btn">Duplicate</button>
              <button class="btn btn-sm btn-secondary" id="bulk-export-btn">Export CSV</button>
              <button class="btn btn-sm btn-outline-danger" id="bulk-delete-btn">Delete</button>
              <button class="btn btn-sm btn-ghost" id="bulk-clear-btn">Clear</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="table-card" id="products-table-card">
      <div class="table-scroll">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:38px;"><input type="checkbox" class="checkbox" id="select-all"></th>
              <th>Product</th>
              <th>SKU</th>
              <th>Category</th>
              <th>Brand</th>
              <th class="text-right">Price</th>
              <th class="text-right">Discount</th>
              <th class="text-right">Stock</th>
              <th>Status</th>
              <th>Rx</th>
              <th>Popularity</th>
              <th>Created</th>
              <th style="width:110px;">Actions</th>
            </tr>
          </thead>
          <tbody id="products-tbody">
            <tr><td colspan="13"><div class="skeleton skeleton-line" style="margin:12px 0"></div></td></tr>
            <tr><td colspan="13"><div class="skeleton skeleton-line" style="margin:12px 0"></div></td></tr>
            <tr><td colspan="13"><div class="skeleton skeleton-line" style="margin:12px 0"></div></td></tr>
            <tr><td colspan="13"><div class="skeleton skeleton-line" style="margin:12px 0"></div></td></tr>
            <tr><td colspan="13"><div class="skeleton skeleton-line" style="margin:12px 0"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="table-foot">
        <div class="table-foot-info" id="products-page-info">Showing 0–0 of 0</div>
        <div class="pagination" id="products-pagination"></div>
      </div>
    </div>

    <div class="grid grid-4 mt-20" id="products-grid-view" style="display:none;"></div>
  </div>

  <script src="js/admin-shared.js"></script>
  <script src="js/admin-products.js"></script>
</body>
</html>
