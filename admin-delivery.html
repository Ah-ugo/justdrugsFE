<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery — Just Drugs Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="delivery">
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="app-shell"></div>

  <div id="page-content" hidden>
    <div class="page-head">
      <div>
        <h1 class="page-title">Delivery</h1>
        <p class="page-subtitle">Assign riders, track orders and manage delivery zones.</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary" id="dl-zones-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10a8 8 0 0 0-16 0c0 6 8 10 8 10z"/><circle cx="12" cy="12" r="3"/></svg> Zones</button>
        <button class="btn btn-primary" id="dl-team-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M4 21v-1c0-2 3-4 8-4s8 2 8 4v1"/></svg> Delivery Team</button>
      </div>
    </div>

    <div class="grid grid-4 mb-24">
      <div class="card summary-card"><div class="summary-card-label">In Delivery</div><div class="summary-card-value" style="color:var(--info-600)">7</div><div class="summary-card-foot">Assigned & moving</div></div>
      <div class="card summary-card"><div class="summary-card-label">Out for Delivery</div><div class="summary-card-value" style="color:var(--brand-600)">4</div><div class="summary-card-foot">On the road</div></div>
      <div class="card summary-card"><div class="summary-card-label">Delivered Today</div><div class="summary-card-value">18</div><div class="summary-card-foot">98% on-time</div></div>
      <div class="card summary-card"><div class="summary-card-label">Returned</div><div class="summary-card-value" style="color:var(--danger-600)">1</div><div class="summary-card-foot">Needs action</div></div>
    </div>

    <div class="tabs mb-16" id="delivery-tabs">
      <button class="tab active" data-tab="ops">Dispatch Board</button>
      <button class="tab" data-tab="riders">Riders</button>
      <button class="tab" data-tab="zones">Zones & Fees</button>
    </div>

    <div class="tab-panels">
      <!-- Ops board -->
      <div class="tab-panel active" data-panel="ops">
        <div class="card mb-16">
          <div class="card-body">
            <div class="flex items-center justify-between wrap gap-12">
              <div class="input-wrap">
                <span class="input-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></span>
                <input type="text" class="input" id="dl-search" placeholder="Search order #, rider, zone…" style="width:300px;padding-left:36px;">
              </div>
              <div class="flex items-center gap-8">
                <select class="select" id="dl-zone-filter" style="width:180px;">
                  <option value="">All zones</option>
                  <option>Lagos Mainland</option>
                  <option>Lagos Island</option>
                  <option>Ikeja</option>
                  <option>Lekki</option>
                  <option>Victoria Island</option>
                </select>
                <select class="select" id="dl-status-filter" style="width:170px;">
                  <option value="">All statuses</option>
                  <option value="assigned">Assigned</option>
                  <option value="out_for_delivery">Out for Delivery</option>
                  <option value="delivered">Delivered</option>
                  <option value="returned">Returned</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="table-card">
          <div class="table-scroll">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Order</th><th>Customer</th><th>Zone</th><th>Rider</th><th>Status</th>
                  <th>ETA</th><th>Tracking</th><th style="width:100px;">Actions</th>
                </tr>
              </thead>
              <tbody id="delivery-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Riders -->
      <div class="tab-panel" data-panel="riders">
        <div class="grid grid-3" id="riders-grid">
          <!-- rider cards injected -->
        </div>
      </div>

      <!-- Zones -->
      <div class="tab-panel" data-panel="zones">
        <div class="grid grid-3" id="zones-grid">
          <!-- zone cards injected -->
        </div>
      </div>
    </div>
  </div>

  <script src="js/admin-shared.js"></script>
  <script src="js/admin-delivery.js"></script>
</body>
</html>

</content>
